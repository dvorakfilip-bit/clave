# Kontrola při každém pushi: lint, typy a testy (PRD – bod 9, testy logiky)
name: Kontrola

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint src scripts
      - name: Typy
        run: npm run typecheck
      - name: Testy
        run: npm test
